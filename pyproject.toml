[project]
name = "semantic-v2"
version = "0.1.0"
description = "Reddit Sentiment Analysis Research Pipeline for Methane/Dairy Climate Discourse"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.10.8",
    "networkx>=3.6.1",
    "nltk>=3.9.2",
    "numpy",
    "pandas>=3.0.0",
    "praw>=7.8.1",
    "python-dotenv>=1.2.1",
    "scipy",
    "seaborn>=0.13.2",
    "textblob>=0.19.0",
    "torch>=2.10.0",
    "tqdm>=4.67.1",
    "transformers>=5.0.0",
    "emoji>=2.8.0",
    "spacy>=3.7.0",
    "langdetect>=1.0.9",
    "pyarrow>=14.0.0",
    "scikit-learn>=1.4.0",
    "vaderSentiment>=3.3.2",
    "coverage>=7.6.0",
    "pip>=26.0.1",
]

[project.scripts]
run-analysis = "run_analysis:main"
